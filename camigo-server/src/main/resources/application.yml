server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: camigo-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/camigo?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      connect-timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.camigo.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.camigo.controller

camigo:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  routing:
    speed-kilometers-per-hour: ${CAMIGO_ROUTE_SPEED_KMH:5}
    station-base-seconds: ${CAMIGO_STATION_BASE_SECONDS:120}
    pickup-per-parcel-seconds: ${CAMIGO_PICKUP_PER_PARCEL_SECONDS:30}
    destination-base-seconds: ${CAMIGO_DESTINATION_BASE_SECONDS:30}
    storage-per-parcel-seconds: ${CAMIGO_STORAGE_PER_PARCEL_SECONDS:60}
    max-active-orders: ${CAMIGO_MAX_ACTIVE_ORDERS:8}
    algorithm-version: ${CAMIGO_ROUTE_ALGORITHM_VERSION:dijkstra-insertion-v1}
  dispatch:
    offer-seconds: ${CAMIGO_DISPATCH_OFFER_SECONDS:180}
    rejection-window-minutes: ${CAMIGO_DISPATCH_REJECTION_WINDOW_MINUTES:10}
    rejection-threshold: ${CAMIGO_DISPATCH_REJECTION_THRESHOLD:3}
    cooldown-minutes: ${CAMIGO_DISPATCH_COOLDOWN_MINUTES:15}
    distance-weight-percent: ${CAMIGO_DISPATCH_DISTANCE_WEIGHT_PERCENT:40}
    workload-weight-percent: ${CAMIGO_DISPATCH_WORKLOAD_WEIGHT_PERCENT:35}
    service-weight-percent: ${CAMIGO_DISPATCH_SERVICE_WEIGHT_PERCENT:25}
    distance-scale-meters: ${CAMIGO_DISPATCH_DISTANCE_SCALE_METERS:500}
    algorithm-version: ${CAMIGO_DISPATCH_ALGORITHM_VERSION:dispatch-score-v1}
    scheduler-delay-ms: ${CAMIGO_DISPATCH_SCHEDULER_DELAY_MS:5000}

logging:
  level:
    root: INFO
    com.camigo: ${CAMIGO_LOG_LEVEL:INFO}

